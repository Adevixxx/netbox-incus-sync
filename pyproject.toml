[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-incus-sync"
version = "1.0"
description = "Synchronisation automatique des instances Incus vers NetBox"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
keywords = ["netbox", "incus", "lxd", "virtualization", "containers"]

dependencies = [
    "requests-unixsocket",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/Adevixxx/netbox-incus-sync"
Repository = "https://github.com/Adevixxx/netbox-incus-sync.git"
Issues = "https://github.com/Adevixxx/netbox-incus-sync/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_incus_sync*"]

[tool.setuptools.package-data]
netbox_incus_sync = [
    "templates/**/*.html",
    "static/**/*",
]